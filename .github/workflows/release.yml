name: Release

on:
    release:
        types: [published]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: us-central1-docker.pkg.dev
    IMAGE: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors

jobs:
    preflight:
        name: Preflight
        if: github.event.release.prerelease == false
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Read release version
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Tag must look like v1.2.3 (got '$TAG')"
                      exit 1
                  fi
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Assert the tagged commit is on main
              run: |
                  git fetch --quiet origin main
                  if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
                      echo "::error::${{ github.sha }} is not an ancestor of origin/main"
                      exit 1
                  fi

            - name: Assert every manifest matches the tag
              run: node scripts/release.mjs verify "${{ steps.version.outputs.version }}"

    rust:
        name: Test Rust runtime
        needs: preflight
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_actors_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_actors_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt && rustup default 1.89.0

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run tests
              env:
                  DURABLE_ACTORS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_actors_test?sslmode=disable
              run: cargo test --locked --no-fail-fast

            - name: Verify crate package
              run: cargo publish --locked --dry-run

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"

            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sdk build
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored

    npm-ci:
        name: Test npm package
        needs: preflight
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm --dir sdk format:check

            - name: Run tests
              run: pnpm --dir packages/observer-ui test && pnpm --dir sdk test && pnpm --dir packages/observer-ui package:check

            - name: Check and pack the tested npm packages
              run: |
                  pnpm --dir sdk package:check
                  pnpm --dir packages/observer-ui --config.ignore-scripts=true pack --pack-destination ../../dist-tarballs
                  pnpm --dir sdk --config.ignore-scripts=true pack --pack-destination ../dist-tarballs
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sdk-package
                  path: dist-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    go-ci:
        name: Test Modal Go provider
        needs: preflight
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: providers/modal-go
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.27.1"
                  cache-dependency-path: providers/modal-go/go.sum
            - run: test -z "$(gofmt -l .)"
            - run: go test -race -mod=readonly -overlay tests/overlay.json ./...
            - run: go vet -mod=readonly -overlay tests/overlay.json ./...
            - name: Verify provider image packaging
              working-directory: .
              run: node --test tests/scripts/release-workflow.test.mjs

    native:
        needs: preflight
        uses: ./.github/workflows/native-build.yml

    native-publish:
        name: Verify and publish native runtime (${{ matrix.runner }})
        needs: [preflight, rust, npm-ci, go-ci, native]
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  ref: ${{ github.sha }}
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
              with:
                  version: 10.17.1
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.19.0"
                  cache: pnpm
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: native-${{ matrix.runner }}
                  path: dist-runtime
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: sdk-package
                  path: .artifacts
            - run: pnpm install --frozen-lockfile
            - name: Check the packaged SDK and native bundle
              env:
                  DURABLE_ACTORS_TEST_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-${{ needs.preflight.outputs.version }}.tgz
              run: |
                  node --test tests/scripts/build-runtime.test.mjs
                  pnpm --dir examples/chat add --ignore-scripts "$DURABLE_ACTORS_TEST_PACKAGE"
                  pnpm --dir examples/chat exec durable-actors generate
                  pnpm --dir examples/chat build
            - name: Upload native bundles and checksums
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" dist-runtime/*.tar.gz dist-runtime/*.sha256 --clobber

    image-build:
        name: Build runtime image (${{ matrix.arch }})
        needs: preflight
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: blacksmith-4vcpu-ubuntu-2404
                    - arch: arm64
                      platform: linux/arm64
                      runner: blacksmith-4vcpu-ubuntu-2404-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Set up Blacksmith Docker builder
              uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
              with:
                  cache-key: durable-actors/runtime-${{ matrix.arch }}
                  nofallback: true
                  platforms: ${{ matrix.platform }}

            - name: Build runtime image
              uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  outputs: type=docker,dest=${{ runner.temp }}/runtime-image.tar
                  tags: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/TerseAI/durable-actors
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
                      org.opencontainers.image.licenses=MIT

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: runtime-image-${{ matrix.arch }}
                  path: ${{ runner.temp }}/runtime-image.tar
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 1

    image-push:
        name: Push runtime image (${{ matrix.arch }})
        needs: [preflight, rust, npm-ci, go-ci, image-build]
        strategy:
            fail-fast: false
            matrix:
                arch: [amd64, arm64]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: runtime-image-${{ matrix.arch }}
                  path: ${{ runner.temp }}/runtime-image
            - name: Push the validated image
              env:
                  VERSION: ${{ needs.preflight.outputs.version }}
                  ARCH: ${{ matrix.arch }}
              run: |
                  docker load --input "$RUNNER_TEMP/runtime-image/runtime-image.tar"
                  docker push "${IMAGE}:${VERSION}-${ARCH}"

    image:
        name: Publish runtime image
        needs: [preflight, image-push]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            attestations: write
            contents: read
            id-token: write
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - name: Publish multi-platform manifest
              id: manifest
              env:
                  VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools create \
                    --tag "${IMAGE}:${VERSION}" \
                    --tag "${IMAGE}:latest" \
                    "${IMAGE}:${VERSION}-amd64" \
                    "${IMAGE}:${VERSION}-arm64"
                  inspection="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
                  digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspection")"
                  if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "::error::Could not resolve the published manifest digest"
                      exit 1
                  fi
                  echo "digest=${digest}" >> "$GITHUB_OUTPUT"

            - name: Attest image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.manifest.outputs.digest }}

    npm:
        name: Publish npm packages
        needs: [preflight, image, native-publish]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  registry-url: "https://registry.npmjs.org"

            - name: Install trusted-publishing npm version
              run: npm install -g npm@11.9.0

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: sdk-package
                  path: dist-tarballs

            - name: Publish to npm
              env:
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  OBSERVER_VERSION=$(node -p 'require("./packages/observer-ui/package.json").version')
                  if npm view "durable-actors-observer@$OBSERVER_VERSION" version >/dev/null 2>&1; then
                      echo "durable-actors-observer@$OBSERVER_VERSION already published"
                  else
                      npm publish ./dist-tarballs/durable-actors-observer-$OBSERVER_VERSION.tgz --access public
                  fi
                  if npm view "durable-actors@$RELEASE_VERSION" version >/dev/null 2>&1; then
                      echo "durable-actors@$RELEASE_VERSION already published"
                  else
                      npm publish ./dist-tarballs/durable-actors-$RELEASE_VERSION.tgz --access public
                  fi

    crate:
        name: Publish crate
        needs: [preflight, image, native-publish]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  status=$(curl -sS \
                    --user-agent "durable-actors-release/1.0 (+https://github.com/TerseAI/durable-actors)" \
                    -o /dev/null \
                    -w "%{http_code}" \
                    "https://crates.io/api/v1/crates/durable-actors/$RELEASE_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "durable-actors@$RELEASE_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      # The rust job already verified this tagged source with cargo publish --dry-run.
                      cargo publish --locked --no-verify
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi
