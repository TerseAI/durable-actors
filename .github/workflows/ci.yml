name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    go:
        name: Modal Go provider
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: providers/modal-go
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.27.1"
                  cache-dependency-path: providers/modal-go/go.sum
            - run: test -z "$(gofmt -l .)"
            - run: go test -race -mod=readonly -overlay tests/overlay.json ./...
            - run: go vet -mod=readonly -overlay tests/overlay.json ./...
            - name: Verify provider image packaging
              working-directory: .
              run: node --test tests/scripts/release-workflow.test.mjs

    rust:
        name: Rust runtime
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_objects_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_objects_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt && rustup default 1.89.0
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Run tests
              env:
                  DURABLE_OBJECT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_objects_test?sslmode=disable
              run: cargo test --locked --no-fail-fast
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.17.1
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.19.0"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sdk build
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored
            - name: Check the Express and React example
              working-directory: examples/chat
              run: |
                  node ../../sdk/dist/cli.js generate
                  npm run build
            - name: Check the AI chat example
              working-directory: examples/ai-chat
              run: npm run build
            - name: Check the documents example
              working-directory: examples/documents
              run: |
                  node ../../sdk/dist/cli.js generate
                  npm run build

    npm:
        name: TypeScript package
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.17.1
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.19.0"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sdk format:check
            - run: pnpm --dir packages/observer-ui format:check
            - run: pnpm --dir packages/observer-ui test
            - run: pnpm --dir sdk test
            - run: pnpm --dir packages/observer-ui package:check
            - name: Verify npm package
              working-directory: sdk
              run: npm pack --dry-run
