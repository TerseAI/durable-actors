name: Onboarding reproduction artifacts
on:
  push:
    branches: [codex/onboarding-reproduction-040]
    paths: [.github/workflows/onboarding-artifacts.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: providers/modal-go/go.sum
      - run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ubuntu-22.04
          save-if: 'false'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sdk build
      - run: mkdir -p .artifacts/onboarding
      - run: pnpm --dir sdk pack --ignore-scripts --pack-destination ../.artifacts/onboarding
      - run: node scripts/build-runtime.mjs
      - run: cp dist-runtime/* .artifacts/onboarding/
      - run: git rev-parse HEAD > .artifacts/onboarding/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-candidate
          path: .artifacts/onboarding
          retention-days: 14
