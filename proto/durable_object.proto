syntax = "proto3";

package durable_object.v1;

service ActorHostService {
  rpc Activate(ActivateActorRequest) returns (ActivateActorReply);
  rpc Invoke(HostInvokeActorRequest) returns (InvokeActorReply);
  rpc HandleSocket(HostSocketEventRequest) returns (InvokeActorReply);
  rpc PublishSocketEffects(PublishSocketEffectsRequest) returns (Empty);
}

service ActorControlPlaneService {
  rpc Execute(ControlPlaneRequest) returns (ControlPlaneReply);
}

message ControlPlaneRequest {
  bytes command_json = 1;
}

message ControlPlaneReply {
  bytes reply_json = 1;
}

message ActorKey {
  reserved 1;
  string actor_type = 2;
  string actor_id = 3;
}

message InvokeActorRequest {
  reserved 5;

  string request_id = 1;
  ActorKey actor = 2;
  string method = 3;
  bytes args_json = 4;
}

message HostInvokeActorRequest {
  InvokeActorRequest invocation = 1;
  uint64 owner_epoch = 2;
}

message HostSocketEventRequest {
  string request_id = 1;
  ActorKey actor = 2;
  bytes event_json = 3;
  bytes connections_json = 4;
  uint64 owner_epoch = 5;
}

message InvokeActorReply {
  oneof result {
    ActorCompleted completed = 1;
    ActorFailed failed = 2;
    Reroute reroute = 3;
  }
}

message ActorCompleted {
  bytes result_json = 1;
  bytes socket_effects_json = 2;
}

message ActorFailed {
  string code = 1;
  string message = 2;
}

message Reroute {}

message ActivateActorRequest { ActorKey actor = 1; }
message ActivateActorReply {
  uint64 owner_epoch = 1;
}

message Empty {}
message PublishSocketEffectsRequest {
  ActorKey actor = 1;
  uint64 owner_epoch = 2;
  bytes effects_json = 3;
}

service SnapshotService {
  rpc Read(Empty) returns (SnapshotData);
  rpc Write(SnapshotData) returns (SnapshotWriteReply);
}
service ReplicaService {
  rpc Initialize(Empty) returns (Empty);
  rpc Head(Empty) returns (ReplicaStreamHead);
  rpc Seal(Empty) returns (ReplicaSessionHead);
}
service ArchiveService {
  rpc Prepare(ArchiveRequest) returns (ArchiveReply);
}
message SnapshotData { bytes data = 1; }
message SnapshotWriteReply { bool already_exists = 1; }
message ArchiveRequest { string object = 1; }
message ArchiveReply {
  string write_url = 1;
  string read_url = 2;
}
message ReplicaStreamIdentity {
  string session = 1;
  string prefix = 2;
  uint64 owner_epoch = 3;
  uint64 base_version = 4;
}
message ReplicaSnapshotRef {
  string object = 1;
  uint64 state_version = 2;
  string request_id = 3;
  string digest = 4;
}
message ReplicaStreamHead {
  ReplicaStreamIdentity stream = 1;
  ReplicaSnapshotRef latest = 2;
}
message ReplicaSessionHead {
  string session = 1;
  bool initialized = 2;
  bool sealed = 3;
  repeated ReplicaStreamHead streams = 4;
}
