{{- if .Values.telemetry.collector.enabled }}
{{- $sockets := .Values.telemetry.collector.sockets.issuer }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "actors.collectorName" . }}
data:
  collector.yaml: |
    {{- .Files.Get "files/collector.yaml" | nindent 4 }}
  {{- if $sockets }}
  collector-sockets.yaml: |
    {{- .Files.Get "files/collector-sockets.yaml" | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "actors.collectorName" . }}
spec:
  replicas: {{ .Values.telemetry.collector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "actors.collectorName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "actors.collectorName" . }}
      annotations:
        checksum/config: {{ print (.Files.Get "files/collector.yaml") (.Files.Get "files/collector-sockets.yaml") $sockets | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sandbox.gke.io/runtime
                    operator: NotIn
                    values: [gvisor]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: {{ include "actors.image" .Values.images.collector | quote }}
          args:
            - --config=/etc/otelcol/collector.yaml
            {{- if $sockets }}
            - --config=/etc/otelcol/collector-sockets.yaml
            {{- end }}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: health, containerPort: 13133}
            {{- if $sockets }}
            - {name: otlp-internal, containerPort: 4319}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.telemetry.collector.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          env:
            - {name: CONTROL_PLANE_URL, value: {{ .Values.publicUrl | trimSuffix "/" | quote }}}
            {{- if $sockets }}
            - {name: SOCKET_TOKEN_ISSUER, value: {{ $sockets | quote }}}
            {{- end }}
            - {name: CLICKHOUSE_URL, value: {{ .Values.analytics.clickhouse.url | quote }}}
            - {name: CLICKHOUSE_DATABASE, value: {{ .Values.analytics.clickhouse.database | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ .Values.analytics.clickhouse.user | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.credentialsSecret | quote }}, key: {{ .Values.analytics.clickhouse.passwordSecretKey | quote }}}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.credentialsSecret | quote }}, key: {{ .Values.redis.urlSecretKey | quote }}}
            - {name: REDIS_CA_FILE, value: {{ ternary "/redis/ca.crt" "" (not (empty .Values.redis.caSecretKey)) | quote }}}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            {{- if .Values.redis.caSecretKey }}
            - {name: redis-ca, mountPath: /redis, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "actors.collectorName" . }}}
        {{- with .Values.redis.caSecretKey }}
        - name: redis-ca
          secret:
            secretName: {{ $.Values.credentialsSecret | quote }}
            items: [{key: {{ . | quote }}, path: ca.crt}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "actors.collectorName" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "actors.collectorName" . }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc}
    {{- if $sockets }}
    # Gateways only: the sandbox network policy allows 4317 and nothing else.
    - {name: otlp-internal, port: 4319, targetPort: otlp-internal, appProtocol: grpc}
    {{- end }}
{{- end }}
