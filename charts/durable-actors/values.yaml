images:
  # Release packaging supplies immutable digests for all three images.
  controlPlane:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  typescript:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  python:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
cluster:
  projectId: ""
  location: ""
  name: ""
replicaCount: 2
publicUrl: https://actors.useterse.ai
region: north-america-west
storage:
  mode: standard
  authorityBucket: ""
  artifactBucket: ""
  archiveBucket: ""
  rapid:
    buckets: []
    archiveBatchBytes: 16777216
    archiveBatchIntervalMs: 10000
cloudSql:
  instanceConnectionName: ""
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
# Existing Secret in the release namespace, with postgres-url, jwt-signing-key, api-key.
credentialsSecret: terse-credentials
serviceAccount:
  googleServiceAccount: ""
controlPlane:
  nodeSelector: {}
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
sockets:
  maxConnectionsPerActor: 32768
  dedicatedGateway: false
  replicaCount: 2
  nodeSelector: {}
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
hostIdleTimeoutMs: 10000
gateway:
  enabled: true
  className: gke-l7-global-external-managed
  # Existing TLS Secret in the release namespace, valid for publicUrl's hostname.
  tlsSecret: actors-tls
  preSharedCert: ""
  addressName: ""
substrate:
  endpoint: https://api.ate-system.svc
  router: http://atenet-router.ate-system.svc
  atespace: terse
  namespace: terse-substrate
  workerPoolName: shared
  workerLabels: {workload: terse-substrate}
  sandboxConfig: gvisor-default
  snapshotLocation: ""
  trustBundleName: servicedns.podcert.ate.dev:identity:primary-bundle
  worker:
    autoscaling:
      minReplicas: 1
      maxReplicas: 3
      targetAllocationPercent: 70
      scaleDownStabilizationSeconds: 300
    image: us-docker.pkg.dev/gke-substrate-release/substrate/ateom-gvisor:v0.2.0-gke.0@sha256:744175f4531187f08261176f1c395aaab4b57394acc9842d935c113f5559db8c
    cpu: "4"
    memory: 8Gi
    nodeSelector:
      terse.ai/substrate: "true"
      ate.dev/substrate-version: v0.2.0-gke.0
    tolerations:
      - {key: terse.ai/substrate, operator: Equal, value: "true", effect: NoSchedule}
