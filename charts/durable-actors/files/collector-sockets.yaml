# Gateways' WebSocket connection events, merged into collector.yaml when enabled. Gateways are
# trusted and report for many projects at once, so they authenticate with Kubernetes
# service-account tokens on their own port, which sandboxes cannot reach, and each record carries
# its project. Host tokens are not accepted here.
extensions:
  oidc/sockets:
    providers:
      - issuer_url: ${env:SOCKET_TOKEN_ISSUER}
        audience: durable-actors-socket-telemetry

receivers:
  otlp/internal:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: oidc/sockets

exporters:
  clickhouse/sockets:
    endpoint: ${env:CLICKHOUSE_URL}
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    # The control plane owns the schema (src/request_traces/persistence/clickhouse/schema.sql).
    create_schema: false
    logs_table_name: socket_events
    sending_queue:
      batch: {}
  redislive/sockets:
    endpoint: ${env:REDIS_URL}
    ca_file: ${env:REDIS_CA_FILE}
    logs_channel: sockets
    project_from_records: true

service:
  # Lists replace rather than merge, so this repeats collector.yaml's extensions.
  extensions: [health_check, oidc, oidc/sockets]
  pipelines:
    logs/sockets:
      receivers: [otlp/internal]
      processors: [memory_limiter]
      exporters: [clickhouse/sockets, redislive/sockets]
