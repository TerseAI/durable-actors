# Events the control plane reports (WebSocket connections and deployments), merged into
# collector.yaml when enabled. The control plane is trusted and reports for many projects at once,
# so it authenticates with Kubernetes service-account tokens on its own port, which sandboxes
# cannot reach, and each record carries its project. Host tokens are not accepted here.
extensions:
  oidc/platform:
    providers:
      - issuer_url: ${env:PLATFORM_TOKEN_ISSUER}
        audience: durable-actors-platform-telemetry

receivers:
  otlp/internal:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: oidc/platform

exporters:
  clickhouse/platform:
    endpoint: ${env:CLICKHOUSE_URL}
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    # The control plane owns the schema (src/request_traces/persistence/clickhouse/schema.sql).
    create_schema: false
    logs_table_name: platform_events
    sending_queue:
      batch: {}
  redislive/platform:
    endpoint: ${env:REDIS_URL}
    ca_file: ${env:REDIS_CA_FILE}
    logs_channel: platform
    project_from_records: true

service:
  # Lists replace rather than merge, so this repeats collector.yaml's extensions.
  extensions: [health_check, oidc, oidc/platform]
  pipelines:
    logs/platform:
      receivers: [otlp/internal]
      processors: [memory_limiter]
      exporters: [clickhouse/platform, redislive/platform]
