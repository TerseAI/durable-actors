# Events the control plane reports (WebSocket connections and deployments) and sandbox usage the
# node collectors sample, merged into collector.yaml when enabled. Both are trusted and report for
# many projects at once, so they authenticate with Kubernetes service-account tokens on their own
# port, which sandboxes cannot reach. Each event record carries its project; usage reaches a
# project through the sandbox claims redislive/platform records. Host tokens are not accepted here.
extensions:
  oidc/platform:
    providers:
      - issuer_url: ${env:PLATFORM_TOKEN_ISSUER}
        audience: durable-actors-platform-telemetry

receivers:
  otlp/internal:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: oidc/platform
      # Node collectors send over HTTP: the collector's gRPC client won't send a token in plaintext.
      http:
        endpoint: 0.0.0.0:4320
        auth:
          authenticator: oidc/platform

exporters:
  clickhouse/platform:
    endpoint: ${env:CLICKHOUSE_URL}
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    # The control plane owns the schema (src/request_traces/persistence/clickhouse/schema.sql).
    create_schema: false
    logs_table_name: platform_events
    metrics_tables:
      gauge: {name: sandbox_usage}
    sending_queue:
      batch: {}
  redislive/platform:
    endpoint: ${env:REDIS_URL}
    ca_file: ${env:REDIS_CA_FILE}
    logs_channel: platform
    project_from_records: true

service:
  # Lists replace rather than merge, so this repeats collector.yaml's extensions.
  extensions: [health_check, oidc, oidc/platform]
  pipelines:
    logs/platform:
      receivers: [otlp/internal]
      processors: [memory_limiter]
      exporters: [clickhouse/platform, redislive/platform]
    metrics/platform:
      receivers: [otlp/internal]
      processors: [memory_limiter]
      exporters: [clickhouse/platform, redislive/platform]
